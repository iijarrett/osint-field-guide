[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "osint-field-guide"
version = "0.2.2"
description = "A curated OSINT tool guide with a command-line reader. Reads and prints only; never runs an install line."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["pyyaml>=6"]
keywords = ["osint", "reference", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Information Technology",
  "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/iijarrett/osint-field-guide"
Issues = "https://github.com/iijarrett/osint-field-guide/issues"

[project.scripts]
osint-guide = "osintguide.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["osintguide"]

[tool.hatch.build.targets.wheel.force-include]
"data" = "osintguide/data"

[tool.hatch.build.targets.sdist]
include = ["osintguide", "data", "scripts", "tests", "README.md", "LICENSE", "pyproject.toml"]
