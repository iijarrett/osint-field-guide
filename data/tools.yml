- id: sockpuppet
  name: A research identity that survives contact
  section: 14-tradecraft-and-analysis
  kind: free · practice · slow
  tier: deeper
  summary: What a usable research identity needs, why it must be aged, and the rules to check first.
  what: >-
    Several sections here need an account — viewing a LinkedIn profile, joining a Telegram channel, reading
    a forum. That account must not be yours, and a blank one created this morning gets flagged or banned
    immediately. A usable research identity needs: an **aged** account with ordinary activity behind it,
    a profile photo that **does not reverse-image-search** (not a stock photo, not a real person's), a
    consistent and boring backstory, its own email and number, and its own browser profile or VM that
    never touches your real accounts.
  why: >-
    *Why "aged" is the hard requirement:* platform trust-and-safety weights account age and behavioural
    history heavily, so the time to create these is **months before you need them** — an identity built
    the day you need it is the one that gets locked mid-investigation.
  caution:
    title: Check the rules before the tradecraft
    body: >-
      A fake account breaches the terms of service of nearly every platform, which can mean a permanent
      ban and, in some jurisdictions and some professional contexts, worse. Some engagements explicitly
      forbid it. Never use one to *interact* — friending, messaging, or joining a private space is a different
      act from reading — and never impersonate a real person or organization.
  verified:
    date: '2026-11-23'
- id: timeline
  name: Build the timeline — where analysis starts
  section: 14-tradecraft-and-analysis
  kind: free · practice
  tier: start
  summary: One UTC-ordered table of every dated finding, with observation and inference kept apart.
  what: >-
    Put every dated finding into one chronological table: timestamp (in **UTC**), what happened, the source
    it came from, and your confidence in it. Domain registered. Account created. First post. Token deployed.
    Funds moved. Site archived.
  why: >-
    *Why it's the step that turns collection into a conclusion:* a pile of facts proves nothing; the same
    facts in order show *sequence*, and sequence is the argument. It also exposes your gaps and your contradictions
    faster than rereading notes — two sources disagreeing about a date is visible instantly in a timeline
    and invisible in a folder. Keep **observation and inference in separate columns**; a plain markdown
    table or spreadsheet is entirely sufficient.
  notes:
  - >-
    Mind the timezones: normalize everything to UTC as you record it, and note the original zone — a "same
    day" that's actually two days apart has broken more findings than any tool failure
  verified:
    date: '2026-11-23'
- id: verification
  name: Verification — before you believe it
  section: 14-tradecraft-and-analysis
  kind: free · practice
  tier: start
  summary: Ask what would make a claim, image or source false before you rely on it.
  what: >-
    The discipline for a claim, an image, or a source you're about to rely on. For **media**: find the
    earliest version (TinEye sorted oldest-first, §07), establish where and when it was actually taken,
    and check whether it's real footage being recycled from an older event — the most common form of false
    claim by far. For a **source**: who owns the outlet, does it publish corrections, does it have a named
    masthead, and does any independent outlet carry the same story.
  why: >-
    *Why it's a cross-cutting item and not a section:* it applies to everything above. The reflex worth
    building is **"what would make this false?"** asked before you add a finding to the timeline rather
    than after you publish it. Lateral reading — leaving the page to check the claim elsewhere — beats
    scrutinizing the page itself, every time. The **absence** of corroboration is itself a finding worth
    recording.
  notes:
  - >-
    Media Bias/Fact Check and Wikipedia's article on the outlet for ownership and track record · [Bellingcat's
    case write-ups](https://www.bellingcat.com/category/resources/) are the best free training in how
    the reasoning actually goes
  links:
  - label: Bellingcat's case write-ups
    url: https://www.bellingcat.com/category/resources/
  verified:
    date: '2026-11-23'
- id: monitoring
  name: From one-off search to standing collection
  section: 14-tradecraft-and-analysis
  kind: free · sites + scripts
  tier: deeper
  summary: 'Standing collection: alerts, certificate feeds and scheduled diffs instead of one-off searches.'
  what: >-
    Most of this guide answers a question once. Monitoring answers it continuously. The free layer goes
    a long way: **Google Alerts** for a name or phrase, **RSS** off anything that still publishes a feed,
    **crt.sh** polled for newly issued certificates on your domain and its typosquats, **Have I Been Pwned
    domain monitoring**, GitHub's own secret-scanning alerts, and a scheduled script hitting the APIs
    from §05 into a log you diff.
  why: >-
    *Why the certificate feed is the one to set up first:* it tells you a lookalike domain exists the
    day it's certified, usually days before any phishing email goes out — the earliest warning available
    and it's free. **Tune ruthlessly:** a monitoring system that cries wolf gets ignored within a fortnight,
    which is worse than not having it. Start with two or three high-signal queries and add only what earns
    its place.
  notes:
  - >-
    Google Alerts · [crt.sh](https://crt.sh/) RSS · [HIBP domain monitoring](https://haveibeenpwned.com/DomainSearch)
    · a cron job and a diff covers the rest
  links:
  - label: crt.sh
    url: https://crt.sh/
  - label: HIBP domain monitoring
    url: https://haveibeenpwned.com/DomainSearch
  verified:
    date: '2026-11-23'
- id: standing-intel
  name: MITRE ATT&CK, MISP & OpenCTI
  section: 14-tradecraft-and-analysis
  kind: free · site + Docker
  tier: deeper
  summary: 'MITRE ATT&CK, MISP and OpenCTI: where indicators go once you have them.'
  what: >-
    Where indicators go once you have them. **MITRE ATT&CK** is the shared vocabulary for how attackers
    behave, so your report says "credential dumping" in terms everyone maps identically. **MISP** and
    **OpenCTI** are open-source platforms for storing, linking and sharing indicators, both usually run
    in Docker.
  why: >-
    *Why a defender's guide needs them:* an investigation produces domains, hashes and IPs, and a platform
    gives them structure and a format (STIX) other tools and teams can consume. The learning curve is
    steep, so stand one up locally for practice rather than meeting it for the first time on a job.
  notes:
  - >-
    [attack.mitre.org](https://attack.mitre.org/) · [misp-project.org](https://www.misp-project.org/)
    · [github.com/OpenCTI-Platform/opencti](https://github.com/OpenCTI-Platform/opencti) — follow each
    project's own Docker deployment docs; not scripted here
  links:
  - label: attack.mitre.org
    url: https://attack.mitre.org/
  - label: misp-project.org
    url: https://www.misp-project.org/
  - label: github.com/OpenCTI-Platform/opencti
    url: https://github.com/OpenCTI-Platform/opencti
  github: OpenCTI-Platform/opencti
  verified:
    date: '2026-11-23'
- id: berkeley-protocol
  name: The Berkeley Protocol
  section: 14-tradecraft-and-analysis
  kind: free · reading
  tier: start
  summary: The UN human rights office's standard for digital open-source investigations.
  what: >-
    The UN human rights office's professional standard for digital open-source investigations, written
    with the Human Rights Center at UC Berkeley. It sets out how to plan, collect, preserve, verify and
    analyze online material so that it holds up in a legal or human-rights setting.
  why: >-
    *Why it's on a technical guide:* it names the method this whole guide is a toolbox for, in language
    a court or an employer recognizes. Mapping your own loop (§00) to its six stages — online inquiry,
    preliminary assessment, collection, preservation, verification, investigative analysis — is the quickest
    way to make a writeup read as professional.
  notes:
  - >-
    [ohchr.org — Berkeley Protocol](https://www.ohchr.org/en/publications/policy-and-methodological-publications/berkeley-protocol-digital-open-source)
    — the page refuses automated fetching, so open it in a browser
  links:
