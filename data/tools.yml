- id: maltego-osint
  name: Maltego Community Edition
  section: 14-tradecraft-and-analysis
  kind: free account · local tool
  tier: deeper
  summary: Graph-based link analysis; the free edition is a learning tool, not a production one.
  what: >-
    Link analysis — the visual, graph-based way of doing everything on this guide. Drop an entity on the
    canvas, run a Transform, and it fans out into related entities: domain to subdomains to IPs to certificates
    to owners. The graph is the point; connections nobody was looking for become visible.
  why: >-
    *Current CE limits, September 2026:* free with a Maltego ID, up to **10,000 entities per graph** but
    only **24 results per Transform**, with a baseline of 200 credits a month. That cap makes CE a learning
    tool rather than a production one — which is genuinely fine, because the skill it teaches is thinking
    in graphs. Maltego's own pricing page confirms the free Basic plan and its 200 monthly credits; the
    entity and result caps above are as last checked in September, so re-verify them before quoting.
  install:
  - os: Windows
    note: download the installer from maltego.com/downloads
  - os: macOS
