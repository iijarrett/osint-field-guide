- id: hunchly
  name: Hunchly
  section: 14-tradecraft-and-analysis
  kind: paid · browser extension
  tier: gated
  summary: Paid browser extension that auto-captures every page of a case with hashes and timestamps.
  what: >-
    Automates the above. Turn it on at the start of a case and it silently captures every page you visit
    — full content, screenshot, hash, timestamp — into a case file, tracks your selectors, highlights
    them across pages, and exports a report. Built specifically for investigators who may have to defend
    their evidence.
  why: >-
    *Why it's the professional standard:* it removes the single biggest failure mode, which is forgetting
    to capture something. **Maltego acquired Hunchly in May 2025**, so expect tighter integration with
    Maltego graphs over time — worth factoring in if you're choosing a long-term workflow. Subscription-priced
    — the Classic licence (local storage) is listed at €149 or $169 a year as of November 2026, with a
    30-day free trial, and the site now carries Maltego Technologies' name; the free capture habit above
    is the honest substitute until the work justifies it.
