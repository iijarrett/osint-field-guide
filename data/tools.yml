- id: enrichment
  name: Indicator enrichment — is this already known bad?
  section: 05-domain-ip-network
  kind: free tier · sites + APIs
  tier: start
  summary: Check whether an IP, domain, URL or hash is already known bad before investigating from scratch.
  what: >-
    Before you investigate an IP, domain, URL or file hash from scratch, ask whether someone already has.
    **VirusTotal** for files, URLs and domains across dozens of engines; **AbuseIPDB** for an IP's reported
    abuse history; **GreyNoise** to tell mass internet background scanning from something aimed at you
    specifically; **AlienVault OTX** for community pulses; and the **abuse.ch** family — URLhaus, MalwareBazaar,
    ThreatFox — for malware distribution and current IOCs.
  why: >-
    *Why it belongs at the front of this section:* most indicators you'll ever look at are already documented,
    and five minutes of enrichment saves an hour of original work. **GreyNoise is the one that changes
    a decision** — "this IP scans the entire internet daily" and "this IP touched only you" are different
    incidents.
  caution:
    title: Uploading is disclosure
    body: >-
      Submitting a file or URL to VirusTotal can make it public, and submissions are visible to paying
      subscribers — including, potentially, the adversary who sent it. *Search* by hash rather than uploading
      whenever you can, and never upload a document from a live investigation or anything containing client
      data.
  verified:
    date: '2026-11-23'
- id: wigle
  name: WiGLE — geolocating a Wi-Fi network
  section: 05-domain-ip-network
  kind: free account · site + API
  tier: deeper
  summary: Geolocate a Wi-Fi network from its BSSID or SSID in a global wardriving database.
  what: >-
    A global wardriving database of wireless networks contributed by volunteers, searchable by **BSSID**
    (the access point's hardware address) or **SSID** (its name). Given either, it returns where that
    network has been observed — often to street level.
  why: >-
    *Why a BSSID is a location:* access points rarely move, so a BSSID in a photo of a router, in a device's
    saved-network list, or in a leaked config is a physical address. An unusual SSID is nearly as good
    — a distinctive network name often appears exactly once in the database. The mirror-image lesson is
    that **your own home SSID is probably in there**, and suffixing it with `_nomap` is what removes it
    from Google's and Microsoft's equivalents.
  notes:
  - >-
    [wigle.net](https://wigle.net/) — free account needed to search · [geowifi](https://github.com/GONZOsint/geowifi)
    queries several such databases at once
  links:
  - label: wigle.net
    url: https://wigle.net/
  - label: geowifi
    url: https://github.com/GONZOsint/geowifi
  verified:
    date: '2026-11-23'
