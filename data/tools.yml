- id: theharvester
  name: theHarvester
  section: 06-organization
  kind: free · local tool · Python
  tier: deeper
  summary: Emails, employee names, subdomains and hosts for a domain from search engines and logs.
  what: >-
    The classic organizational recon tool: give it a domain and it sweeps search engines, certificate
    logs, PGP key servers and data sources for **email addresses, employee names, subdomains and hosts**
    associated with it. One command, broad sources.
  why: >-
    *Why it's still standard:* it's the fastest way to assemble the human attack surface of an organization,
    and it's preinstalled on Kali. Combine its output with the email pattern from Hunter.io in section
    02 and you have the full construct-any-address capability.
  install:
  - os: All OS
    cmd: git clone https://github.com/laramies/theHarvester ; cd theHarvester ; uv sync
  - os: Run
    cmd: uv run theHarvester -d example.com -b crtsh,certspotter
  - os: Kali
    note: preinstalled
  notes:
  - >-
    As of its README on 23 Nov 2026 the current release is 4.11.1 and asks for a very recent Python; `uv`
    fetches the right one for you. On Windows run it inside WSL. Source at github.com/laramies/theHarvester.
  links:
  - label: github.com/laramies/theHarvester
    url: https://github.com/laramies/theHarvester
  github: laramies/theHarvester
  caution:
    title: Don't install it from PyPI
    body: >-
      The `theHarvester` package on PyPI is an abandoned placeholder — version 0.0.1 from 2019, nothing
      to do with the real project. `pip install theHarvester` gets you a stub. Use Kali's copy or install
      from the GitHub repo.
  verified:
    date: '2026-11-23'
    install_checked: partial
- id: tech-stack
  name: Tech-stack fingerprinting & job postings
  section: 06-organization
  kind: free tier · sites + extension
  tier: deeper
  summary: Fingerprint a site's stack, and read the job postings that list the rest.
  what: >-
    What an organization *runs*, established two ways. **Wappalyzer** or **BuiltWith** fingerprint a site's
    stack from the browser. And their **job postings** list it outright — "experience with Okta, CrowdStrike,
    ServiceNow and Azure AD required" is a free internal architecture diagram.
  why: >-
    *Why job ads are the sleeper source:* no tool needed, entirely passive, and organizations publish
    their security stack, their cloud provider and their internal tooling voluntarily because they have
    to hire. The defensive lesson is identical — **read your own postings and see what you're advertising**.
  notes:
  - '[wappalyzer.com](https://www.wappalyzer.com/) — browser extension, free tier; then just read the
    careers page'
  links:
  - label: wappalyzer.com
    url: https://www.wappalyzer.com/
  verified:
    date: '2026-11-23'
- id: tracker-ids
  name: Shared tracker & analytics IDs
  section: 06-organization
  kind: free · sites + view-source
  tier: deeper
  summary: Analytics, AdSense and pixel IDs that link a network of sites to one operator.
  what: >-
    The highest-yield infrastructure pivot on this guide. A site's page source carries identifiers its
    operator reused across everything they run — a Google Analytics `UA-`/`G-` tag, an AdSense publisher
    ID, a Facebook Pixel, a Matomo site ID. Search those strings and you get every other site the same
    person set up.
  why: >-
    *Why it beats WHOIS now:* registration privacy hides the owner, but analytics IDs are pasted into
    the page by hand and almost nobody thinks to vary them. This is the single technique that most reliably
    links a network of scam sites, a shell-company web presence, or a disinformation cluster to one operator.
    Also pivot on **favicon hashes** and unique script paths via urlscan's search.
  notes:
  - >-
    Read the page source, or use [analyzeid.com](https://analyzeid.com/) / [spyonweb.com](https://spyonweb.com/)
    · then confirm the set with a urlscan.io search on the same ID
  links:
  - label: analyzeid.com
    url: https://analyzeid.com/
  - label: spyonweb.com
    url: https://spyonweb.com/
  verified:
    date: '2026-11-23'
- id: exif-osint
  name: ExifTool — read the metadata first
  section: 07-photo-video
  kind: free · local tool
  tier: start
  summary: 'Read embedded metadata first: GPS, timestamps, camera serial numbers, editing software.'
  what: >-
    Always the first move. Dumps every embedded field: GPS coordinates, capture timestamp, camera make,
    model and *serial number*, lens, software used to edit, and often an author or copyright string. On
    documents it reveals author, organization, and revision history.
  why: >-
    *Why first:* it's free, instant, and sometimes ends the investigation on the spot with a GPS tag.
    When it comes back empty, that's information too — **major platforms strip EXIF on upload**, so a
    stripped file means it came through a social network, while an intact one means you have an original
    off a phone or camera. Camera serial numbers link separate photos to one device.
  install:
  - os: Windows
    cmd: winget install OliverBetz.ExifTool
  - os: macOS
    cmd: brew install exiftool
  - os: Linux
    cmd: sudo apt install libimage-exiftool-perl
  - os: Run
    cmd: exiftool -a -G1 image.jpg
  notes:
  - The winget ID was not machine-checked; the Homebrew formula was.
  github: exiftool/exiftool
  verified:
    date: '2026-11-23'
    install_checked: partial
- id: reverse-image
  name: Reverse image search — all four engines
  section: 07-photo-video
  kind: free · sites
  tier: start
  summary: Yandex, Google Lens, Bing and TinEye each find different things; crop before you search.
  what: >-
    Run the image through **Yandex**, **Google Lens**, **Bing Visual Search** and **TinEye**. They are
    not interchangeable and the difference is large: Yandex is markedly the strongest at faces, places
    and visually-similar-but-not-identical images; TinEye is the one that finds *exact* copies and, crucially,
    sorts by **oldest first** so you can find the original.
  why: >-
    *The technique worth knowing:* crop before you search. Feeding the whole photo gets you "generic street
    scene"; cropping to the one distinctive thing — a shop sign, a bus livery, an unusual building — gets
    you the location. Run each crop through all four.
  notes:
  - >-
    [yandex.com/images](https://yandex.com/images/) · [lens.google.com](https://lens.google.com/) · [tineye.com](https://tineye.com/)
    — and Bing's visual search
  links:
  - label: yandex.com/images
    url: https://yandex.com/images/
  - label: lens.google.com
    url: https://lens.google.com/
  - label: tineye.com
    url: https://tineye.com/
  verified:
    date: '2026-11-23'
- id: geolocation
  name: Geolocation — the chronolocation toolkit
  section: 07-photo-video
  kind: free · sites · practice
  tier: deeper
  summary: Place and date an unlabelled photo from terrain, signage, shadows and street imagery.
  what: >-
    Pinning an undated, untagged photo to a place and time by reasoning from what's in it. The working
    set: **Google Earth** and street-level imagery for matching terrain and buildings, **Mapillary** and
    KartaView for street views where Google has none, **Overpass Turbo** to query OpenStreetMap for features
    ("every church with a spire within 5km of a river"), and **SunCalc** to derive the time of day and
    date range from shadow angles.
  why: >-
    *Why it's the flagship skill:* this is the technique behind most published open-source investigations,
    and it's almost entirely analytical — road markings, power pylon design, licence plate format, vegetation,
    language on signage. The tools just check the hypothesis you formed by looking.
  notes:
  - >-
    [overpass-turbo.eu](https://overpass-turbo.eu/) · [suncalc.org](https://www.suncalc.org/) · [mapillary.com](https://www.mapillary.com/)
    · ShadeMap and Shadow Finder for shadow analysis · KartaView · overhead imagery is in §12
  links:
  - label: overpass-turbo.eu
    url: https://overpass-turbo.eu/
  - label: suncalc.org
    url: https://www.suncalc.org/
  - label: mapillary.com
    url: https://www.mapillary.com/
  verified:
    date: '2026-11-23'
- id: invid
  name: InVID / WeVerify — video verification
  section: 07-photo-video
  kind: free · browser extension
  tier: deeper
  summary: 'Browser extension for video: keyframe extraction, metadata, magnification and forensic filters.'
  what: >-
    The standard verification toolkit for video, built for newsrooms. Splits a video into keyframes so
    you can reverse-image-search each one, reads platform metadata, magnifies and enhances regions, checks
    a Twitter/X account's history, and runs forensic filters for manipulation.
  why: >-
    *Why it exists as one extension:* video can't be reverse-searched directly — the keyframe step is
    the whole trick, and doing it by hand is tedious. Increasingly load-bearing now that synthetic video
    is cheap: the first question about any dramatic clip is whether it's old footage recycled, and keyframe
    search answers that in a minute.
  notes:
  - Extension for Chrome and Firefox — search "InVID WeVerify" in your browser's add-on store
  verified:
    date: '2026-11-23'
- id: face-search
  name: Facial-recognition search engines
  section: 07-photo-video
  kind: paid · sites
  tier: gated
  summary: Search the web by face. The most invasive capability in this guide; use it on yourself only.
  what: >-
    PimEyes and its competitors index faces across the public web and let you search by face rather than
    by image. Given a photo of a person, they return other photos of the same person from unrelated sites.
  why: >-
    *Why it's flagged, not recommended:* it works, it's paid, and it is the single most invasive capability
    on this guide. It is **restricted or outright unlawful in several jurisdictions** — EU data-protection
    regulators have taken action against exactly this — and searching a third party's face without a lawful
    basis is a real legal exposure, not a theoretical one. Know the capability exists, because your adversaries
    and your clients' harassers use it.
  caution:
    title: The defensive use is the legitimate one
    body: >-
      Searching your *own* face to find out where you appear online is both lawful and genuinely useful,
      and PimEyes offers an opt-out for exactly that. Anything beyond that needs a documented lawful basis
      and, in a professional context, written authorization.
  verified:
    date: '2026-11-23'
- id: platform-search
  name: Native platform search, used hard
  section: 08-social
  kind: free · practice
  tier: start
  summary: Each platform's own advanced search, which is often the only thing that still works.
  what: >-
    Each platform's own advanced search, which almost nobody uses to capacity. X/Twitter's advanced search
    filters by account, date range, replies-to and geocode. Reddit supports `author:` and `subreddit:`.
    LinkedIn filters by company, title and location. Facebook's search is weak but its *public* friend
    lists and photo tags are not.
  why: >-
    *Why this leads now:* with the APIs closed, the native interface is frequently the **only** thing
    that still works. A date-bounded advanced search on one account beats any scraper that 403s. Pair
    with `site:` operators from section 04 to reach what the platform's own search hides.
  verified:
    date: '2026-11-23'
- id: fediverse-bluesky
  name: Mastodon, the Fediverse & Bluesky
  section: 08-social
  kind: free · sites + practice
  tier: deeper
  summary: Searching Mastodon, the wider Fediverse and Bluesky, which work differently from closed networks.
  what: >-
    The decentralized social networks work differently from the closed ones. **Mastodon** posts live on
    whichever server the account joined, and full-text search of posts is opt-in per account, so search
    is deliberately weak — work through hashtag timelines, the home server's public profile, and `site:`
    operators. **Bluesky** profiles and posts are public by default and readable without an account, and
    a handle can be verified through DNS, which makes the domain behind a custom handle a pivot back to
    §05.
  why: >-
    *Why a separate entry:* the tools built for the closed platforms mostly don't reach here, and almost
    no OSINT guide covers it. Bellingcat's toolkit lists **BskyFollowFinder** for mapping who follows
    whom on Bluesky and **Hoaxy** for tracing how a link or claim spreads across Bluesky and X.
  notes:
  - >-
    Bluesky: [bsky.app](https://bsky.app/) (no login to read) · Mastodon: the home server's `/@username`
    page · both: archive first — [web.archive.org](https://web.archive.org/), [archive.today](https://archive.today/)
  links:
  - label: bsky.app
    url: https://bsky.app/
  - label: web.archive.org
    url: https://web.archive.org/
  - label: archive.today
    url: https://archive.today/
  caution:
    title: Federation copies things
    body: >-
      A post deleted on one server can survive on others that already pulled it. Capture before you contact
      or react, and remember that an account's home server is its jurisdiction — a report to a trust-and-safety
      team goes to that server's admins.
  verified:
    date: '2026-11-23'
- id: social-archives
  name: Deleted posts & social archives
  section: 08-social
  kind: free · sites
  tier: start
  summary: Archives and caches that remember what people delete.
  what: >-
    People delete. Archives remember. The Wayback Machine holds snapshots of public profiles; archive.today
    captures dynamic pages the Wayback Machine struggles with; Google and Bing caches occasionally hold
    a recently-removed page; and third-party mirrors preserve deleted content on several platforms.
  why: >-
    *Why it's the highest-yield social technique:* the post someone deleted is almost always the interesting
    one, and the act of deletion is itself a finding. **Archive first, read second** — the moment a subject
    notices attention, things start disappearing.
  notes:
  - Same tools as §05 — [web.archive.org](https://web.archive.org/) and [archive.today](https://archive.today/)
  links:
  - label: web.archive.org
    url: https://web.archive.org/
  - label: archive.today
    url: https://archive.today/
  verified:
    date: '2026-11-23'
- id: telegram-discord
  name: Telegram & Discord
  section: 08-social
  kind: free · sites + accounts
  tier: deeper
  summary: Where much threat-actor activity lives, and how to read it without joining in.
  what: >-
    Where a great deal of threat-actor and extremist activity actually lives. Telegram's public channels
    are indexed by several third-party search sites and are genuinely open; Discord requires joining a
    server but leaks user IDs, join dates and cross-server presence once you're in.
  why: >-
    *Why it's essential for threat intel:* ransomware leak sites, initial-access brokers, credential markets
    and hacktivist coordination run on these platforms now, and monitoring them is mainstream CTI work.
    **Telegram usernames pivot straight back to section 01**, and the same handle is often reused across
    markets and forums.
  notes:
  - >-
    Telegram search engines and trackers listed by Bellingcat: Telegago, TGStat, Telemetrio, TelegramDB
    — all browser-based, no install · Telepathy is listed there as unmaintained, so it is on the Skip
    list
  caution:
    title: Joining is participation
    body: >-
      Entering a server or channel is active, logged, and visible to admins. Use a burner identity on
      a separate machine, never interact, and be clear on your authorization — passively reading a public
      channel and engaging with a criminal marketplace are very different acts, legally and ethically.
  verified:
    date: '2026-11-23'
- id: bot-detection
  name: Telling a real account from a fake one
  section: 08-social
  kind: free · practice
  tier: deeper
  summary: Tell real accounts from fake ones by observable behaviour, not by a bot score.
  what: >-
    Judged on behaviour, not vibes. The signals that actually discriminate: **creation date versus activity
    volume** (an account made last month with 8,000 posts), **posting rhythm** (activity at a constant
    rate around the clock, or confined to one timezone's working hours regardless of claimed location),
    **a profile photo that reverse-image-searches** to a stock library or another person, **follower-to-following
    ratio and follower quality**, and near-identical phrasing appearing across accounts within minutes.
  why: >-
    *Why no tool is listed:* the automated "bot score" services are unreliable and several well-known
    ones have shut down or gone paid with no transparency about their model. The manual signals above
    are more defensible and you can show your work. **Coordination is the stronger finding anyway** —
    one suspicious account proves little; fifty accounts posting the same sentence within a two-minute
    window is a network, and that's what you report.
  caution:
    title: '"Bot" is a conclusion, not an observation'
    body: >-
      Record what you saw — creation date, posting frequency, reused photo — and let the label follow.
      Plenty of real people post constantly, use a stock avatar, or have few followers; calling a real
      person's account fake in a published finding is the kind of error that ends credibility.
  verified:
    date: '2026-11-23'
- id: darkweb
  name: Dark-web research, safely
  section: 08-social
  kind: free · Tor + sites
  tier: gated
  summary: Leak-site trackers first, Tor in a disposable VM only if you must.
  what: >-
    Where leaked data, ransomware victim postings and criminal marketplaces are published. **Ahmia** indexes
    onion sites and is reachable from the clear web; **ransomware leak-site trackers** (ransomwatch and
    similar) aggregate victim postings so you don't have to visit the sites at all; several CTI vendors
    publish free dark-web search front ends.
  why: >-
    *Why the clear-web mirrors come first:* for most questions — "has my organization been named on a
    leak site," "is this breach real" — a tracker answers it without ever opening Tor. Go direct only
    when the tracker doesn't cover it, and then through **Tor Browser in a disposable VM**, never your
    daily machine.
  notes:
  - '[ahmia.fi](https://ahmia.fi/) — clear-web onion index, filters known-abusive content'
  links:
  - label: ahmia.fi
    url: https://ahmia.fi/
  caution:
    title: Reading is not the risk; interacting is
    body: >-
      Downloading leaked data, registering on a marketplace, or contacting a seller moves you from observation
      to participation and can be a criminal offence regardless of intent. Never download a breach dump
      "to verify it," never create an account on a criminal forum without explicit written authorization,
      and know that some content is illegal to possess the instant it renders.
  verified:
    date: '2026-11-23'
- id: hibp
  name: Have I Been Pwned
  section: 09-breach-credentials
  kind: free · site + paid API
  tier: start
  summary: 'The ethical breach index: which breaches an address is in, never the passwords.'
  what: >-
    The reputable, ethical breach index. Tells you which breaches an address appears in and what data
    classes each exposed — but never shows you a password. **Domain search** lets a verified domain owner
    see every breached address across their whole organization, which is the defensive killer feature.
  why: >-
    *Why it's the one to start with:* run by Troy Hunt, transparent about sources, and deliberately designed
    not to be an attack tool. For your own exposure and your own domain it's free and authoritative. The
    API is paid but cheap, and the k-anonymity password endpoint lets you check passwords without ever
    sending one.
  links:
  - label: haveibeenpwned.com
    url: https://haveibeenpwned.com/
  verified:
    date: '2026-11-23'
- id: breach-search
  name: Commercial breach-data search
  section: 09-breach-credentials
  kind: paid · sites
  tier: gated
  summary: >-
    Paid indexes that return breached records themselves. Powerful, and one subpoena from your worst browser
    history.
  what: >-
    DeHashed, Intelligence X, Snusbase and similar go further than HIBP: they index the breach *contents*
    and let you search by email, username, name, phone, IP or hashed password, returning the actual records.
    Intelligence X additionally archives darknet, document and leak material with its own historical snapshots.
  why: >-
    *Why these are gated here:* they are powerful, they are used legitimately by CTI teams and incident
    responders every day, and they are also one subpoena away from being the worst thing in your browser
    history if you can't explain why you ran a query. Subscription-based, and you should be able to justify
    every lookup.
  caution:
    title: Searching is not the same as using
    body: >-
      Querying breach data about your own organization under authorization is normal professional work.
      Using a credential you found to *log into* anything is unauthorized access — a serious criminal
      offence in essentially every jurisdiction, regardless of how the password reached you. The line
      is bright and it is not about where the data came from.
  verified:
    date: '2026-11-23'
- id: self-exposure
  name: Run this whole guide on yourself
  section: 09-breach-credentials
  kind: free · practice
  tier: start
  summary: 'Run this whole guide against yourself: the best exercise on the list.'
  what: >-
    Take your own name, your own handles, your own email and work sections 01 through 08 against yourself
    (and 10 if you write code). Write down everything you find and where it came from.
  why: >-
    *Why it's the best exercise on the page:* you have ground truth. You know which hits are wrong, which
    aggregator merged you with a stranger, and which forgotten 2014 account is still sitting there with
    your real name on it — so you learn what these sources actually do, not what they claim.
  verified:
    date: '2026-11-23'
- id: github-dorking
  name: GitHub code search & dorking
  section: 10-code-and-apps
  kind: free account · site
  tier: start
  summary: GitHub code search qualifiers for finding committed secrets and internal naming.
  what: >-
    GitHub's code search reads the contents of public repositories, and its qualifiers make it a targeted
    instrument: `org:`, `user:`, `language:`, `path:`, `filename:`. Combine an organization's name or
    domain with the shape of a secret — `"example.com" AND (password OR api_key OR BEGIN RSA)`, or `filename:.env`,
    `filename:config.json`, `path:.aws credentials`.
  why: >-
    *Why it's the first stop:* a single committed `.env` file can contain a live database password, and
    people commit them weekly. Beyond credentials it maps an organization's internal naming — hostnames,
    service names, staff usernames in commit metadata, which cloud provider they use. **Commit history
    is the sharp edge**: a secret deleted in a later commit is still in the history and still searchable.
  notes:
  - Signed-in search at [github.com/search](https://github.com/search) — needs an account for code search
  links:
  - label: github.com/search
    url: https://github.com/search
  caution:
    title: Finding a credential is where you stop
    body: >-
      A live key in a public repo is a *finding*, to be reported to its owner. Using it is unauthorized
      access and a criminal offence — the fact that it was published by accident changes nothing. Report
      through a security.txt contact, a bug-bounty program, or the repo owner directly.
  verified:
    date: '2026-11-23'
- id: code-search-engines
  name: grep.app, Sourcegraph, GitLab & Searchcode
  section: 10-code-and-apps
  kind: free tier · sites
  tier: deeper
  summary: grep.app, Sourcegraph, GitLab and Searchcode reach code GitHub search does not.
  what: >-
    GitHub is not the only forge, and its own search has quirks. **grep.app** does fast literal and regex
    search across a large slice of public GitHub with no login at all — the quickest way to test whether
    a distinctive string exists anywhere. **Sourcegraph** searches across multiple hosts with real structural
    queries. **GitLab** and **Searchcode** reach repos GitHub-only searching never sees.
  why: >-
    *Why run more than one:* each indexes a different corpus, and a secret pushed to a self-hosted GitLab
    mirror or an obscure forge is exactly the one nobody has found yet. grep.app's regex support is also
    better for hunting a pattern — an internal hostname format, a key prefix — rather than a known string.
  notes:
  - >-
    [grep.app](https://grep.app/) · [sourcegraph.com](https://sourcegraph.com/search) · [gitlab.com/search](https://gitlab.com/search)
    · [searchcode.com](https://searchcode.com/)
  links:
  - label: grep.app
    url: https://grep.app/
  - label: sourcegraph.com
    url: https://sourcegraph.com/search
  - label: gitlab.com/search
    url: https://gitlab.com/search
  - label: searchcode.com
    url: https://searchcode.com/
  verified:
    date: '2026-11-23'
- id: secret-scanners
  name: TruffleHog
  section: 10-code-and-apps
  kind: free · local tools
  tier: deeper
  summary: Scan a repo's full history for credentials and test whether they still work.
  what: >-
    Automate the above against a repo you can clone. **TruffleHog** walks the **entire commit history**
    looking for credential patterns — hundreds of detectors for specific providers — and then *verifies*
    many of the keys it finds by testing whether they still authenticate, which separates a dead 2019
    token from a live one.
  why: >-
    *Why verification is the whole value (TruffleHog v3.99 as of November 2026):* raw regex scanning produces
    overwhelming false positives, and a report full of expired keys gets ignored. "Seventeen matches,
    three still valid" is actionable. Point these at your own organization's repos on a schedule — this
    is the defensive use, and it's the one you'll run most.
  install:
  - os: macOS
    cmd: brew install trufflehog
  - os: Docker
    cmd: docker run --rm -it trufflesecurity/trufflehog:latest github --repo https://github.com/<org>/<repo>
  - os: Win/Linux
    note: download the release for your OS from github.com/trufflesecurity/trufflehog/releases
  - os: Run local
    cmd: trufflehog git file://. --only-verified
  notes:
  - >-
    Upstream's README also shows a curl-to-shell installer; this guide prefers brew, Docker or the release
    binary so you can inspect what you run.
  links:
  - label: github.com/<org
    url: https://github.com/<org
  - label: github.com/trufflesecurity/trufflehog
    url: https://github.com/trufflesecurity/trufflehog
  github: trufflesecurity/trufflehog
  verified:
    date: '2026-11-23'
    install_checked: partial
- id: apk-analysis
  name: Pulling intelligence out of a mobile app
  section: 10-code-and-apps
  kind: free · local tools
  tier: gated
  summary: 'Static analysis of an Android app: endpoints, keys, trackers, permissions, signing details.'
  what: >-
    An APK is a zip file full of evidence. Static analysis surfaces the **backend endpoints** the app
    talks to (frequently including staging and internal APIs), **hardcoded keys and tokens**, the **third-party
    SDKs and trackers** embedded in it, the permissions it requests, and signing-certificate details that
    link separate apps to one developer.
  why: >-
    *Why it's an OSINT source and not just an appsec task:* the endpoint list is an attack-surface map
    the organization never published, and the SDK inventory tells you who they share data with. **MobSF**
    is the standard one-stop analyzer; **apktool** and **jadx** do the decompilation by hand; **Exodus
    Privacy** gives you the tracker list with no install at all. Gated here because it needs a sandbox,
    real time, and clear authorization.
  install:
  - os: Docker
    cmd: docker run -it --rm -p 8000:8000 opensecurity/mobile-security-framework-mobsf:latest
    note: (then open http://localhost:8000)
  - os: macOS
    cmd: brew install jadx
  - os: Linux
    cmd: sudo apt install jadx
    note: (Kali) — or the release zip
  - os: Windows
    note: download the jadx release zip from github.com/skylot/jadx/releases
  notes:
  - >-
    [MobSF](https://github.com/MobSF/Mobile-Security-Framework-MobSF) in Docker · [jadx](https://github.com/skylot/jadx)
    for readable decompiled source · [Exodus Privacy](https://reports.exodus-privacy.eu.org/) for the
    tracker report with no install at all.
  links:
  - label: MobSF
    url: https://github.com/MobSF/Mobile-Security-Framework-MobSF
  - label: jadx
    url: https://github.com/skylot/jadx
  - label: Exodus Privacy
    url: https://reports.exodus-privacy.eu.org/
  github: MobSF/Mobile-Security-Framework-MobSF
  caution:
    title: Analyze in a VM, and check the licence
    body: >-
      Run an unknown APK's analysis in a disposable VM, never install it on a real device, and remember
      that reverse-engineering a third party's app may breach its terms of service or local law even when
      the file is public.
  verified:
    date: '2026-11-23'
    install_checked: partial
- id: block-explorers
  name: Block explorers — read the ledger directly
  section: 11-wallets-tokens
  kind: free · sites
  tier: start
  summary: 'Read any chain''s ledger directly: transactions, counterparties and the first funding source.'
  what: >-
    One explorer per chain, all free, no account: **Etherscan** (and the equivalent Arbiscan / BscScan
    / Polygonscan), **mempool.space** or Blockchain.com for Bitcoin, **Solscan** for Solana, **Tronscan**
    for Tron. Paste an address and you get every transaction it has ever made, its current balance, its
    counterparties, and the first time it was funded.
  why: >-
    *Why the first funding transaction matters most:* a fresh scam wallet had to get its gas from somewhere,
    and that source is frequently an **exchange withdrawal** — which means a KYC'd account, which means
    a real identity sitting behind a subpoena. You can't see who; you can see *which exchange*, and that's
    the finding. Etherscan's labels also flag known exchange, bridge and mixer addresses for you.
  notes:
  - >-
    [etherscan.io](https://etherscan.io/) · [mempool.space](https://mempool.space/) · [solscan.io](https://solscan.io/)
  links:
  - label: etherscan.io
    url: https://etherscan.io/
  - label: mempool.space
    url: https://mempool.space/
  - label: solscan.io
    url: https://solscan.io/
  verified:
    date: '2026-11-23'
- id: chain-tracing
  name: Visual tracing & address clustering
  section: 11-wallets-tokens
  kind: free tier · sites
  tier: deeper
  summary: Graph tools that draw fund flows and cluster addresses into entities.
  what: >-
    Following funds through dozens of hops in a table is unworkable; these draw it as a graph. **Breadcrumbs**
    and **MetaSleuth** both have usable free tiers for tracing a flow, tagging addresses and saving an
    investigation. **Arkham** and **Nansen** add entity labels that attribute clusters of addresses to
    named exchanges, funds and protocols.
  why: >-
    *What clustering actually gives you:* one actor usually controls many addresses, and common-input
    heuristics group them — turning forty addresses into one entity you can reason about. The commercial
    ceiling is Chainalysis and TRM, which is where law enforcement works; **the free tools get you most
    of the way for a single scam trace**. Expect the trail to end at a mixer or a cross-chain bridge,
    and say so plainly when it does rather than guessing past it.
  notes:
  - >-
    [breadcrumbs.app](https://www.breadcrumbs.app/) · [metasleuth.io](https://metasleuth.io/) · [intel.arkm.com](https://intel.arkm.com/)
  links:
  - label: breadcrumbs.app
    url: https://www.breadcrumbs.app/
  - label: metasleuth.io
    url: https://metasleuth.io/
  - label: intel.arkm.com
    url: https://intel.arkm.com/
  verified:
    date: '2026-11-23'
- id: rugpull-checks
  name: Token & rug-pull checks
  section: 11-wallets-tokens
  kind: free · sites
  tier: start
  summary: Contract and liquidity checks that tell you whether a token is a trap.
  what: >-
    Before tracing anything, establish whether the token itself is a trap. The checks that matter: is
    the contract **verified and its source published**; is liquidity **locked or burned**, or can the
    deployer withdraw it; does the code contain a **mint, blacklist, or transfer-tax function** the owner
    can flip; and is the supply concentrated in a handful of wallets. **Token Sniffer**, **GoPlus** and
    **DEXTools** automate most of this; **rugcheck.xyz** covers Solana.
  why: >-
    *Why it's the fast verdict:* an unverified contract holding unlocked liquidity with 90% of supply
    in the deployer's wallet is a rug pull that hasn't happened yet, and you can establish that in two
    minutes. Also cross-check the *team* — a "doxxed" founder whose photo reverse-image-searches to a
    stock library (§07) or whose LinkedIn was created last month (§08) settles it without touching the
    chain at all.
  notes:
  - >-
    [tokensniffer.com](https://tokensniffer.com/) · [GoPlus token security](https://gopluslabs.io/token-security)
    · [rugcheck.xyz](https://rugcheck.xyz/)
  links:
  - label: tokensniffer.com
    url: https://tokensniffer.com/
  - label: GoPlus token security
    url: https://gopluslabs.io/token-security
  - label: rugcheck.xyz
    url: https://rugcheck.xyz/
  caution:
    title: None of this is financial advice, and a clean report is not a safe token
    body: >-
      These scanners check contract mechanics, not intent. A technically clean contract can still be run
      by someone who walks away with the money. This section is for *investigating* a scam, not for deciding
      what to buy.
  verified:
    date: '2026-11-23'
- id: air-tracking
  name: Flightradar24, FlightAware & ADS-B Exchange
  section: 12-tracking
  kind: free tier · sites
  tier: start
  summary: Live and historical aircraft positions from transponder broadcasts.
  what: >-
    Live and historical aircraft positions, built from the transponder broadcasts aircraft send in the
    clear. Flightradar24 and FlightAware have the friendliest interfaces and the deepest history behind
    a paywall; ADS-B Exchange is the community-fed alternative. **GPSJam** maps where GPS signals are
    being jammed or spoofed, inferred from aircraft reporting poor navigation accuracy.
  why: >-
    *Why it's an investigative source:* an aircraft registration (the tail number) ties to an owner record,
    and a flight history ties that owner to places and dates. Cross-check the registration against the
    civil-aviation register for its country. **Know what you're citing:** ADS-B Exchange was acquired
    by JETNET in 2023, so its "unfiltered" reputation is history (see the Skip list), and military or
    blocked aircraft are missing or delayed on every one of these.
  notes:
  - >-
    [flightradar24.com](https://www.flightradar24.com/) · [flightaware.com](https://www.flightaware.com/)
    · [globe.adsbexchange.com](https://globe.adsbexchange.com/) · [gpsjam.org](https://gpsjam.org/) —
    no install
  links:
  - label: flightradar24.com
    url: https://www.flightradar24.com/
  - label: flightaware.com
    url: https://www.flightaware.com/
  - label: globe.adsbexchange.com
    url: https://globe.adsbexchange.com/
  - label: gpsjam.org
    url: https://gpsjam.org/
  caution:
    title: Public data, private people
    body: >-
      A private jet's movements are public, and a pattern of one person's movements is still a profile
      of one person. Keep the question about the aircraft or the event, and don't publish a live position
      for anything that could put someone at risk.
  verified:
    date: '2026-11-23'
- id: ship-tracking
  name: MarineTraffic, VesselFinder, Equasis & Global Fishing Watch
  section: 12-tracking
  kind: free tier · sites
  tier: start
  summary: AIS vessel positions plus the registry layer behind them.
  what: >-
    Vessel positions from AIS, the ship-to-ship broadcast system, plus the registry layer behind them.
    **MarineTraffic** and **VesselFinder** show live and recent tracks. **Equasis** (free account) gives
    the vessel's IMO number, flag, owner and manager, and inspection history. **Global Fishing Watch**
    is free and maps fishing activity and gaps in AIS coverage.
  why: >-
    *Why the registry layer matters:* a name can change, but the IMO number stays with the hull, so Equasis
    is how you follow a ship through renamings and reflaggings. **An AIS gap is a lead, not proof** —
    coverage is patchy and transponders fail — but a ship that goes dark repeatedly near the same place
    is exactly what sanctions and fisheries investigators look for.
  notes:
  - >-
    [marinetraffic.com](https://www.marinetraffic.com/) · [vesselfinder.com](https://www.vesselfinder.com/)
    · [equasis.org](https://www.equasis.org/) · [globalfishingwatch.org](https://globalfishingwatch.org/)
    — no install; Equasis needs a free account
  links:
  - label: marinetraffic.com
    url: https://www.marinetraffic.com/
  - label: vesselfinder.com
    url: https://www.vesselfinder.com/
  - label: equasis.org
