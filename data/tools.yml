- id: webrecorder
  name: ArchiveWeb.page & Browsertrix (Webrecorder)
  section: 14-tradecraft-and-analysis
  kind: free tool · hosted option
  tier: deeper
  summary: Capture pages and sessions the way a browser actually saw them, with replayable archives.
  what: >-
    Webrecorder's tools capture the web the way a browser actually experienced it. **ArchiveWeb.page**
