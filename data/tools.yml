- id: people-search
  name: People-search aggregators
  section: 04-real-name
  kind: free & paid · sites
  tier: gated
  summary: 'Data-broker profiles: leads to confirm elsewhere, never findings on their own.'
  what: >-
    The data-broker layer — Spokeo, BeenVerified, TruePeopleSearch, Whitepages, FastPeopleSearch and dozens
    more. They aggregate public records, marketing databases and scraped social data into a profile: addresses,
    relatives, phone numbers, age.
  why: >-
    *Why to treat carefully:* the data is often **wrong, stale, or about a different person with the same
    name** — aggregators merge records aggressively and never correct. Use them to generate leads you
    then confirm in a primary source, never as a finding on their own. The free tiers are mostly a teaser
    for a subscription.
  caution:
    title: The mirror of this is your own exposure
    body: These sites hold a profile on you right now.
  verified:
    date: '2026-11-23'
- id: public-records
  name: Court, property & voter records
  section: 04-real-name
  kind: free & paid · sites
  tier: deeper
  summary: 'Court, property and voter records: the primary sources the aggregators scrape.'
  what: >-
    The primary sources the aggregators are scraping. In the US: **CourtListener / RECAP** for federal
    case documents (free, and a genuine public good), **PACER** for the official federal docket (paid
    per page), county assessor and recorder sites for property ownership, and state business registries.
    Many jurisdictions publish voter rolls.
  why: >-
    *Why it beats the aggregators:* it's authoritative, dated, and citable. A property record naming an
    owner at an address is evidence; a Spokeo profile saying the same thing is a rumor. Slower, jurisdiction-specific,
    and worth the time when the finding has to hold up.
  notes:
  - '[courtlistener.com](https://www.courtlistener.com/) — free federal case law and dockets via the RECAP
    archive'
  links:
  - label: courtlistener.com
    url: https://www.courtlistener.com/
  verified:
    date: '2026-11-23'
- id: genealogy
  name: Obituaries & genealogy sources
  section: 04-real-name
  kind: free tier · sites
  tier: deeper
  summary: Obituaries and genealogy sites that name a whole family in one permanent document.
  what: >-
    Obituaries name the entire family — spouse, children, siblings, the town they live in, sometimes employers
    — in one indexed, permanent document. FamilySearch, FindAGrave and newspaper archives make them searchable.
  why: >-
    *Why investigators love them:* a single obituary can resolve a family network that would take days
    to assemble any other way, and people who scrub their own online presence rarely think about a relative's
    death notice from 2011. It's also a reminder that **your exposure includes what other people publish
    about you**.
  notes:
  - '[familysearch.org](https://www.familysearch.org/) — free with an account'
  links:
  - label: familysearch.org
    url: https://www.familysearch.org/
  verified:
    date: '2026-11-23'
- id: whois-rdap
  name: WHOIS / RDAP & DNS history
  section: 05-domain-ip-network
  kind: free · site + CLI
  tier: start
  summary: Registration dates, registrar and nameservers, plus historical DNS from before privacy was
    switched on.
  what: >-
    Registration date, registrar, nameservers, and — occasionally — a real registrant. GDPR redacted most
    contact details years ago, so the **dates and nameservers** are now the valuable fields. Pair with
    historical DNS (SecurityTrails, DNSlytics, ViewDNS) to see what the records used to say before privacy
    was switched on.
  why: >-
    *The single best triage signal:* a domain registered four days ago and already sending you email is
    a phishing domain, and that one field settles it faster than any analysis. Historical records are
    where the un-redacted 2015 registrant email is still sitting.
  notes:
  - >-
    `whois example.com` · [viewdns.info](https://viewdns.info/) · [securitytrails.com](https://securitytrails.com/)
    (free account)
  links:
  - label: viewdns.info
    url: https://viewdns.info/
  - label: securitytrails.com
    url: https://securitytrails.com/
  verified:
    date: '2026-11-23'
- id: asn-bgp
  name: ASN, BGP & netblock lookups
  section: 05-domain-ip-network
  kind: free · sites
  tier: start
  summary: Map an IP to its network block and the autonomous system that runs it.
  what: >-
    Every IP belongs to a network block, and every block to an autonomous system (ASN) run by someone.
    **Hurricane Electric's BGP Toolkit** (bgp.he.net) and **RIPEstat** take an IP, ASN or organization
    and return the prefixes it announces, its peers, and its registered name and contacts.
  why: >-
    *Why it matters:* it answers "what else does this organization run" without touching the target —
    the netblocks of a company, or the hosting provider behind a phishing site, and which of its neighbours
    are bulletproof hosts. It's the passive complement to Amass's ASN mapping below.
  notes:
  - >-
    [bgp.he.net](https://bgp.he.net/) · [stat.ripe.net](https://stat.ripe.net/) · `whois -h whois.cymru.com
    " -v 203.0.113.5"` for a quick IP-to-ASN lookup on Linux and macOS
  links:
  - label: bgp.he.net
    url: https://bgp.he.net/
  - label: stat.ripe.net
    url: https://stat.ripe.net/
  verified:
    date: '2026-11-23'
- id: crtsh
  name: Certificate transparency logs
  section: 05-domain-ip-network
  kind: free · site
  tier: start
  summary: Search the public certificate logs for every subdomain a domain has ever certified.
  what: >-
    Every TLS certificate issued by a public CA is written to an append-only public log. Search a domain
    at **crt.sh** and you get the subdomains it has ever certified — including internal-sounding ones
    nobody meant to publish: `vpn.`, `staging.`, `jira.`, `backup-admin.`
  why: >-
    *Why it's the best free recon there is:* completely passive — you query a log, never the target —
    and the data is authoritative rather than guessed. It also catches **typosquats and lookalike domains**
    the moment someone certifies one, which is how you spot a phishing campaign being built against your
    own org before it launches.
  notes:
  - '[crt.sh](https://crt.sh/) — try `%.example.com` as the query'
  links:
  - label: crt.sh
    url: https://crt.sh/
  verified:
    date: '2026-11-23'
- id: urlscan-osint
  name: urlscan.io
  section: 05-domain-ip-network
  kind: free tier · site + API
  tier: start
  summary: Sandboxed page scans with screenshot and request chain, plus a searchable archive of everyone's
    scans.
  what: >-
    Visits a URL in a sandbox on your behalf and hands back a screenshot, the full request chain, every
    domain contacted, and the page's DOM — without you ever loading it. **Also searchable**: you can hunt
    the archive of everyone else's scans for a favicon hash, a domain, or a piece of page content.
  why: >-
    *Why the search half is underused:* pivoting on a favicon hash or a unique script across urlscan's
    history finds every other site running the same phishing kit.
  notes:
  - >-
    [urlscan.io](https://urlscan.io/) — mark sensitive scans **unlisted**; public scans are visible to
    everyone, including your target
  links:
  - label: urlscan.io
    url: https://urlscan.io/
  verified:
    date: '2026-11-23'
- id: shodan-censys
  name: Shodan, Censys & friends
  section: 05-domain-ip-network
  kind: free account · paid to use properly
  tier: gated
  summary: 'Search engines for internet-facing machines: ports, banners, certificates, exposed panels.'
  what: >-
    Search engines for machines rather than pages. They continuously scan the internet and index what
    answers — open ports, service banners, software versions, TLS certificates, exposed panels and cameras.
    Query by organization, ASN, certificate, or product version.
  why: >-
    *Current state, November 2026:* Shodan's account page lists a one-time membership at $49 (100 query
    credits and 16 monitored IPs) with subscription tiers above it, and a free account includes a limited
    free API plan. **Censys has moved to the Censys Platform and deprecated its Legacy Search and Legacy
    API**, so older tutorials and scripts point at a dead endpoint; a free Censys account gives basic
    visibility into standard ports and services. FOFA and ZoomEye are the non-US alternatives with different
    coverage. **Netlas** has a free community plan — 50 requests a day and 2,500 search results a month,
    non-commercial — which is currently the more usable free option. **Criminal IP** is live, but its
    homepage no longer shows a free tier, so check before relying on it. **LeakIX** asks a different question
    and gets its own entry below.
  verified:
    date: '2026-11-23'
- id: leakix
  name: LeakIX
  section: 05-domain-ip-network
  kind: free · site + API · account to see detail
  tier: deeper
  summary: 'Index of exposed misconfigurations: open databases, buckets, Git directories and admin panels.'
  what: >-
    Shodan tells you *what is running* at an address. LeakIX tells you *what is exposed* — it indexes
    the misconfigurations themselves: open Elasticsearch and MongoDB instances, world-readable S3 and
    storage buckets, exposed Git directories, unprotected admin panels, and services matching known vulnerability
    signatures. Searchable by `port:`, `protocol:`, `asn:` and CIDR range.
  why: >-
    *Why it earns a separate entry:* it's a narrower index that answers the question you actually have
    during an authorized assessment or a self-audit — not "what does this org run" but "what has this
    org left open." Running your own domains and ASN through it is a five-minute exposure check with a
    genuinely different result set from Shodan's. It also names the researcher who reported each finding,
    which makes provenance unusually clear.
  notes:
  - >-
    [leakix.net](https://leakix.net/) — browsing is open; a free account unlocks the detail on individual
    findings; the free plan delays results by 15 days and the first paid tier is about €25 a month
  links:
  - label: leakix.net
    url: https://leakix.net/
  caution:
    title: An open database is still someone's database
    body: >-
      LeakIX shows you unauthenticated services. Connecting to one you don't own is unauthorized access
      whether or not it asked for a password — the absence of a lock is not an invitation. Look, record,
      report; never connect.
  verified:
    date: '2026-11-23'
- id: bucket-search
  name: GrayhatWarfare — exposed cloud storage
  section: 05-domain-ip-network
  kind: free tier · site
  tier: deeper
  summary: Search engine over publicly readable cloud storage buckets.
  what: >-
    A search engine over publicly readable cloud storage buckets (S3, Azure and similar). Search by keyword,
    filename or extension and it lists what was left open — backups, spreadsheets, source archives.
  why: >-
    *Why it's here:* misconfigured buckets are one of the commonest self-inflicted exposures, and searching
    your own organization's names is a fast audit. It sits beside LeakIX above — LeakIX finds exposed
    services, this finds exposed files.
  notes:
  - '[grayhatwarfare.com](https://grayhatwarfare.com/) — limited free tier; a paid plan lifts the caps'
  links:
  - label: grayhatwarfare.com
    url: https://grayhatwarfare.com/
  caution:
    title: Open is not yours
    body: >-
      A world-readable bucket still belongs to someone. Looking at a listing is research; opening, downloading
      or modifying someone else's files is unauthorized access. Record the bucket name, report it to its
      owner, and stop.
  verified:
    date: '2026-11-23'
- id: amass
  name: OWASP Amass
  section: 05-domain-ip-network
  kind: free · local tool · Go
  tier: deeper
  summary: Deep attack-surface mapping from dozens of passive sources, with optional active modes.
  what: >-
    The heavyweight attack-surface mapper. Pulls from dozens of passive sources — certificate logs, search
    engines, DNS aggregators, ASN data — and optionally goes active with brute-forcing and zone walking,
    then graphs the whole result. Maps not just subdomains but the netblocks and ASNs an organization
    owns.
  why: >-
    *Why it's the deep option:* nothing else assembles the same breadth in one run, and the ASN mapping
    finds infrastructure that isn't under the obvious domain at all. **Know which mode you're in** — passive
    enumeration is invisible, active brute-forcing hammers the target's DNS and will show up in their
    logs. **Amass is now on v5** (5.1.x), which moved results into a local asset database with an engine
    service behind the command line, so v4-era tutorials and flags may not apply — read the current docs
    before copying a command.
  install:
  - os: macOS
    cmd: brew install amass
  - os: Linux
    cmd: sudo apt install amass
    note: (Kali and some Debian releases — check the version it gives you)
  - os: Any OS
    cmd: go install -v github.com/owasp-amass/amass/v5/...@main
    note: (needs a current Go; see §00)
  notes:
  - >-
    Upstream's docs live at owasp-amass.github.io/docs. The passive-only flag in v4 was `amass enum -passive
    -d example.com` — confirm its v5 equivalent there before relying on it.
  links:
  - label: github.com/owasp-amass/amass
    url: https://github.com/owasp-amass/amass
  github: owasp-amass/amass
  verified:
    date: '2026-11-23'
    install_checked: partial
- id: projectdiscovery
  name: subfinder + httpx
  section: 05-domain-ip-network
  kind: free · local tools · Go
  tier: deeper
  summary: subfinder lists subdomains passively; httpx shows which ones answer, with titles and tech.
  what: >-
    The fast, composable pair from ProjectDiscovery. **subfinder** does passive subdomain enumeration
    and nothing else, extremely quickly. **httpx** takes that list and reports which hosts actually answer,
    with status codes, page titles, technologies and TLS details.
  why: >-
    *Why alongside Amass:* different philosophy — Amass is one deep tool, these are Unix pipes. `subfinder
    -d example.com | httpx -title -tech-detect` gives you a live, annotated inventory in seconds, and
    slots into a script far more easily. Most practitioners run both and merge.
  install:
  - os: macOS
    cmd: brew install subfinder httpx
  - os: Any OS
    cmd: go install -v github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
  - os: ''
    cmd: go install -v github.com/projectdiscovery/httpx/cmd/httpx@latest
  - os: Run
    cmd: subfinder -d example.com | httpx -title -tech-detect
  notes:
  - >-
    A Python package also called `httpx` installs a command with the same name. If the wrong one answers,
    check `where httpx` (Windows) or `which -a httpx` and put Go's bin folder first on your PATH. httpx's
    README asks for Go 1.25 or newer and warns the project moves fast — read the changelog before updating.
  links:
  - label: github.com/projectdiscovery/subfinder
    url: https://github.com/projectdiscovery/subfinder
  - label: github.com/projectdiscovery/httpx
    url: https://github.com/projectdiscovery/httpx
  github: projectdiscovery/subfinder
  verified:
    date: '2026-11-23'
    install_checked: partial
- id: wayback
  name: Wayback Machine & archive.today
  section: 05-domain-ip-network
  kind: free · sites
  tier: start
  summary: Archived copies of what a site used to say, and a way to preserve what it says now.
  what: >-
    What the site said before they changed it. The Internet Archive's Wayback Machine holds snapshots
    going back decades; **archive.today** is the complement — it captures on demand, renders JavaScript,
    and keeps copies of things the Wayback Machine has been asked to remove.
  why: >-
    *Two distinct uses.* Historically: old staff pages, old contact details, the un-redacted version of
    a document. Operationally: **archive anything you find, immediately**, so your evidence survives the
    page being deleted the day after you cite it. The Wayback CDX API also dumps every URL ever archived
    under a domain — a free, entirely passive site map.
  notes:
  - >-
    [web.archive.org](https://web.archive.org/) · [archive.today](https://archive.today/) · CDX: `web.archive.org/cdx/search/cdx?url=*.example.com`
    · [Common Crawl](https://commoncrawl.org/) for bulk index queries across the whole web
  links:
