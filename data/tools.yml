- id: bench-vm
  name: A research VM or a clean browser profile
  section: 00-bench-and-loop
  kind: free · practice · one-time
  tier: deeper
  summary: A disposable VM or a clean browser profile to run everything from.
  what: >-
    A disposable machine — a Kali or Ubuntu VM you can snapshot and throw away — or, at the very least,
    a separate browser profile that never signs in to anything personal. Every tool on this guide runs
    from here.
  why: >-
    *Why first:* a snapshot means a misbehaving tool costs you a revert instead of a reinstall, and nothing
    you touch can be tied back to your real accounts.
  install:
  - os: Windows
    cmd: winget install Oracle.VirtualBox
  - os: macOS
    cmd: brew install --cask utm
    note: (Apple silicon) or brew install --cask virtualbox (Intel)
  - os: Linux
    cmd: sudo apt install virtualbox
  - os: Then
    note: import a Kali VM image from kali.org/get-kali, take a snapshot, work from the copy
  - os: Profile
    cmd: firefox -P
    note: (profile manager — make one profile per research identity)
  notes:
  - >-
    Windows and apt names were not machine-checked; Homebrew names were. If one fails, `winget search
    virtualbox` or `apt search virtualbox` gives the current name.
  verified:
    date: '2026-11-23'
    install_checked: partial
- id: bench-tools
  name: 'Shared prerequisites: Python, pipx, Go, Git, Docker'
  section: 00-bench-and-loop
  kind: free · local tools · one-time
  tier: deeper
  summary: One-time setup of Python, pipx, Go, Git and Docker so every later install is a one-liner.
  what: >-
    Almost every local tool in this guide installs through one of four routes: `pipx` for Python tools,
    `go install` for Go tools, `git clone` for projects that ship as source, and Docker for anything with
    a web service. Set all four up once and the per-tool lines below become one-liners.
  why: >-
    *Why pipx and not pip:* it puts each tool in its own isolated environment, so one tool's dependencies
    can't break another's and nothing touches your system Python. **uv** is the fast installer a few newer
    tools (theHarvester) now expect.
  install:
  - os: Windows
    cmd: winget install Python.Python.3.13 GoLang.Go Git.Git Docker.DockerDesktop
  - os: ''
    cmd: py -m pip install --user pipx ; py -m pipx ensurepath
  - os: macOS
    cmd: brew install python pipx go git uv ; brew install --cask docker-desktop ; pipx ensurepath
  - os: Linux
    cmd: sudo apt install python3 pipx golang-go git docker.io ; pipx ensurepath
  - os: All OS
    cmd: pipx install uv
    note: (skip on macOS if you used brew above)
  - os: Check
    cmd: python --version ; pipx --version ; go version ; git --version ; docker --version
  notes:
  - >-
    Open a new terminal after `pipx ensurepath`. Go tools need a recent Go — subfinder's README asks for
    1.24 and httpx's for 1.25 — and the distro `golang-go` is often older; if `go version` is too low,
    take the tarball from go.dev/dl. Docker Desktop on Windows needs virtualization enabled in firmware.
  verified:
    date: '2026-11-23'
    install_checked: partial
- id: bench-keys
  name: A key vault and one login per research identity
  section: 00-bench-and-loop
  kind: free · local tool
  tier: start
  summary: A password manager entry per service and a folder per research identity.
  what: >-
    API keys, throwaway-account logins and recovery codes live in a password manager, one entry per service
    and one folder per research identity — never in a text file beside your notes.
  why: >-
    *Why it's a step:* OSINT piles up accounts (Shodan, urlscan, VirusTotal, Netlas, a burner Google account
    for GHunt) and keys. Set them through each tool's config file or an environment variable, and never
    commit them — a notes repo with a pasted key in it is exactly the mistake §10 exists to catch.
  install:
  - os: Windows
    cmd: winget install KeePassXCTeam.KeePassXC
  - os: macOS
    cmd: brew install --cask keepassxc
  - os: Linux
    cmd: sudo apt install keepassxc
  verified:
    date: '2026-11-23'
    install_checked: partial
- id: bench-case
  name: A case folder and a log, the same every time
  section: 00-bench-and-loop
  kind: free · practice
  tier: start
  summary: One folder and one log per investigation, laid out the same way every time.
  what: >-
    One folder per investigation with a fixed layout: `capture/` for screenshots and archived pages, `notes/`
    for the running log, `exports/` for raw tool output, `timeline/` for the table you build in §14. One
    log line per finding.
  why: >-
    *Why fixed:* a layout you never have to think about is one you'll actually use at 2 a.m., and it's
    what lets you hand the folder to someone else. Hash anything you might later have to defend, at the
    moment you save it.
  install:
  - os: Windows
    cmd: New-Item -ItemType Directory -Path case-001\capture, case-001\notes, case-001\exports, case-001\timeline
  - os: macOS/Linux
    cmd: mkdir -p case-001/{capture,notes,exports,timeline}
  - os: 'Hash: Win'
    cmd: Get-FileHash -Algorithm SHA256 .\case-001\capture\*
  - os: 'Hash: Mac'
    cmd: shasum -a 256 case-001/capture/*
  - os: 'Hash: Linux'
    cmd: sha256sum case-001/capture/*
  notes:
  - 'log line: `time (UTC) · selector · source URL · what I saw · confidence · archive link`'
  verified:
    date: '2026-11-23'
    install_checked: partial
- id: bench-leaks
  name: Check what the other side can see, once
  section: 00-bench-and-loop
  kind: free · site
  tier: start
  summary: Confirm the exit IP, DNS resolver and WebRTC address before the first case.
  what: >-
    Before the first case, load a leak-test page from the bench and confirm the exit IP, DNS resolver
    and WebRTC address are the ones you expect, and that no personal account is signed in to the browser
    profile.
  why: >-
    *Why:* the bench only protects you if it isn't quietly announcing your home connection. It takes two
    minutes and is worth repeating after any VPN or network change.
  notes:
  - '[browserleaks.com](https://browserleaks.com/) — IP, WebRTC and DNS tests'
  links:
  - label: browserleaks.com
    url: https://browserleaks.com/
  verified:
    date: '2026-11-23'
- id: loop-scope
  name: 1 · Scope and authorize
  section: 00-bench-and-loop
  kind: before the first query
  summary: Write down who or what you're investigating, why, what you will and won't touch, and who authorized
    it.
  what: >-
    Write down who or what you're investigating, why, what you will and won't touch, and who authorized
    it. For a self-audit the authorization is you; for anyone else it's a written scope.
  why: >-
    *Why first:* it's the one step that can't be done afterwards, and it decides which sections are in
    play. Authorized recon on your own domains can go active; research on a private individual stays strictly
    passive and may need a lawful basis.
  step: true
  verified:
    date: '2026-11-23'
- id: loop-seeds
  name: 2 · List your seeds, pick a starting section
  section: 00-bench-and-loop
  kind: minutes
  summary: List what you already hold and pick the section to start in.
  what: >-
    A seed is whatever you already hold. Write each one down and route it: username → §01 · email → §02
    · phone → §03 · real name → §04 · domain or IP → §05 · company → §06 · image or video → §07 · social
    post → §08 · breach question → §09 · repo or app → §10 · wallet → §11 · ship, aircraft or satellite
    image → §12 · suspected fake → §13.
  why: >-
    *Why a list:* it turns "look into this" into a queue with an order, and the list is what you extend
    when a finding becomes a new selector.
  step: true
  verified:
    date: '2026-11-23'
- id: loop-collect
  name: 3 · Collect passive first
  section: 00-bench-and-loop
  kind: default mode
  summary: 'Start with sources that never touch the target: certificate logs, archives, public records.'
  what: >-
    Start with sources that never touch the target — certificate logs, archives, public records, search
    operators, aggregator sites. Treat anything active (scans, brute-forcing, joining a channel, saving
    a contact) as a separate decision that you log.
  why: >-
    *Why:* passive work is invisible and almost always in scope; active work is neither. The `passive`/`active`
    distinction is the first thing a reviewer of your report will ask about.
  step: true
  verified:
    date: '2026-11-23'
- id: loop-capture
  name: 4 · Capture as you go
  section: 00-bench-and-loop
  kind: every finding
  summary: Record URL, UTC time, screenshot and archive link when you find it, not at the end.
  what: >-
    URL, UTC timestamp, a screenshot that shows the address bar, and an archive link — recorded when you
    find it, not at the end. §14 covers the habit and the tools (Hunchly, ArchiveBox, SingleFile).
  why: '*Why now:* the interesting page is the one that disappears once someone notices attention.'
  step: true
  verified:
    date: '2026-11-23'
- id: loop-pivot
  name: 5 · Pivot, then re-seed
  section: 00-bench-and-loop
  kind: the actual skill
  summary: 'Every finding is a new selector: re-seed and go round again.'
  what: >-
    Every finding is a new selector: a profile gives an email, the email gives a breach, the breach gives
    a second handle. Add each to the seed list, work it through its own section, and stop when pivots
    stop paying.
  why: >-
    *Why a stop rule:* without one, an investigation expands until it hits the budget. Decide the depth
    in step 1 — "two hops from the starting selector" is a perfectly good scope.
  step: true
  verified:
    date: '2026-11-23'
- id: loop-verify
  name: 6 · Verify before it counts
  section: 00-bench-and-loop
  kind: gate
  summary: A finding enters the timeline only after a second, independent source.
  what: >-
    A finding enters the timeline only after you've asked what would make it false and looked for a second,
    independent source. One aggregator hit is a lead; a hit confirmed in a primary record is a finding.
  why: >-
    *Why a gate:* the cost of a wrong finding grows with every step built on top of it. The method is
    in §14's verification entry.
  step: true
  verified:
    date: '2026-11-23'
- id: loop-report
  name: 7 · Analyze and write up
  section: 00-bench-and-loop
  kind: the deliverable
  summary: Order findings into a UTC timeline, then report question, scope, method and findings.
  what: >-
    Order the dated findings into a timeline (UTC), keep observation and inference in separate columns,
    then report: the question, scope, method, findings with confidence, what you did *not* do or couldn't
    verify, and the log as an appendix. Redact third parties.
  why: >-
    *Why it's the point:* collection without a report is trivia. A short report that states its limits
    is more credible than a long one that doesn't.
  step: true
  verified:
    date: '2026-11-23'
- id: maigret
  name: Maigret
  section: 01-username
  kind: free · local tool · Python
  tier: start
  summary: Username search across thousands of sites that also parses each hit into a profile dossier.
  what: >-
    Checks a username against thousands of sites and — the part that matters — **parses what it finds**,
    pulling names, bios, avatars, linked accounts and IDs off each hit into a single dossier. Exports
    to HTML, PDF and JSON. A fork of Sherlock that grew well past it.
  why: >-
    *Why first:* the extraction step saves you opening 40 tabs by hand, and it's the most actively developed
    of the three — version 0.6.7 is current on PyPI as of November 2026. Where Sherlock says "account
    exists," Maigret says "account exists, and here's the display name and the linked Twitter."
  install:
  - os: All OS
    cmd: pipx install maigret
  - os: Run
    cmd: maigret <username> --html
  github: soxoj/maigret
  verified:
    date: '2026-11-23'
    install_checked: partial
- id: sherlock
  name: Sherlock
  section: 01-username
  kind: free · local tool · Python
  tier: start
  summary: 'The original username hunter: one handle across 400+ networks, fast and simple.'
  what: >-
    The original and still the best-known username hunter — checks one handle across 400+ social networks
    and reports where it exists. Fast, simple output, no parsing. Ships preinstalled in Kali.
  why: >-
    *Why still run it:* different site list from Maigret, and actively maintained (0.16.2, September 2026).
    Running both and comparing is standard practice — each catches sites the other misses. Treat every
    hit as a *lead*, not a fact: common handles collide, and plenty of sites return a false positive on
    any string you give them.
  install:
  - os: All OS
    cmd: pipx install sherlock-project
  - os: Run
    cmd: sherlock <username>
  - os: Kali
    note: already installed
  github: sherlock-project/sherlock
  verified:
    date: '2026-11-23'
    install_checked: partial
- id: blackbird
  name: Blackbird
  section: 01-username
  kind: free · local tool · Python
  tier: start
  summary: Username and email search over the WhatsMyName dataset, with PDF and CSV export.
  what: >-
    A username and email search tool in the same family as Maigret and Sherlock. It checks a handle against
    600-plus sites using the WhatsMyName dataset, can export results to PDF and CSV, and has an optional
    AI-profiling feature that summarizes what it found.
  why: >-
    *Why a second pick:* a different front end over the community dataset, and actively developed — its
    repository shows hundreds of commits and many stars. The AI summary sends your findings to a third-party
    service; leave it off for anything sensitive. Treat every hit as a lead, as with the other two.
  install:
  - os: All OS
    cmd: git clone https://github.com/p1ngul1n0/blackbird ; cd blackbird
  - os: Windows
    cmd: python -m venv .venv ; .venv\Scripts\activate ; pip install -r requirements.txt
  - os: macOS/Linux
    cmd: python3 -m venv .venv && source .venv/bin/activate && pip install -r requirements.txt
  - os: Run
    cmd: python blackbird.py --username <handle>
  notes:
  - >-
    Install steps follow the project's README layout; read `requirements.txt` before installing and keep
    it in the research VM. There is a PyPI package named `blackbird`, but it was not confirmed to be this
    project, so this guide doesn't use it.
  links:
  - label: github.com/p1ngul1n0/blackbird
    url: https://github.com/p1ngul1n0/blackbird
  github: p1ngul1n0/blackbird
  verified:
    date: '2026-11-23'
    install_checked: partial
- id: whatsmyname
  name: WhatsMyName
  section: 01-username
  kind: free · site + dataset
  tier: start
  summary: Community-maintained dataset of 700+ account-detection rules, with a web front end.
  what: >-
    A community-maintained JSON dataset of 700+ sites and their account-detection rules, plus a web front
    end you can just type into. No install needed for the basic use.
  why: >-
    *Why it matters:* it's the **data layer half the other tools are built on**, and it's curated harder
    than any single scanner's built-in list — detection rules get fixed when a site changes. Use the web
    version for a quick check; pull the JSON when you're building something.
  notes:
  - >-
    [whatsmyname.app](https://whatsmyname.app/) · dataset at [github.com/WebBreacher/WhatsMyName](https://github.com/WebBreacher/WhatsMyName)
  links:
  - label: whatsmyname.app
    url: https://whatsmyname.app/
  - label: github.com/WebBreacher/WhatsMyName
    url: https://github.com/WebBreacher/WhatsMyName
  github: WebBreacher/WhatsMyName
  verified:
    date: '2026-11-23'
- id: handle-pivot
  name: Manual handle pivoting
  section: 01-username
  kind: free · practice
  tier: deeper
  summary: Vary the handle by hand (jsmith, j_smith, jsmith88) and search it as a quoted string.
  what: >-
    The scanners only check the handle you gave them. People mutate: `jsmith` becomes `j_smith`, `jsmith88`,
    `smithj`, `jsmithdev`. Build the variant list by hand and re-run. Then search the raw handle as a
    quoted string in a normal search engine — forum posts, commit logs and pasted profiles surface things
    no enumerator touches.
  why: >-
    *Why it's listed as a step:* this is where most of the actual findings come from, and no tool does
    it for you. The number on the end is usually a birth year. The prefix is usually a real name. Both
    are pivots into section 04.
  verified:
    date: '2026-11-23'
- id: epieos
  name: Epieos
  section: 02-email
  kind: free tier · site
  tier: start
  summary: Email or phone number in, registered services and linked Google account data out.
  what: >-
    Paste an email or phone number and get back the services it's registered with, plus any linked Google
    account data — profile name, photo, public reviews, calendar if it's exposed. The fastest single lookup
    in this section.
  why: >-
    *Why first:* zero setup, and the Google half alone often resolves an anonymous address to a real name
    and face. The free tier is genuinely useful; paid unlocks depth. Run it before you install anything.
  notes:
  - '[epieos.com](https://epieos.com/)'
  links:
  - label: epieos.com
    url: https://epieos.com/
  verified:
    date: '2026-11-23'
- id: ghunt
  name: GHunt
  section: 02-email
  kind: free · local tool · Python
  tier: deeper
  summary: 'Deep extraction from a Google account: name, photo, Maps reviews, YouTube and Calendar.'
  what: >-
    A Google-account investigation framework. Feed it a Gmail address or a Google account ID and it extracts
    the profile name and photo, the account's public Maps reviews and photos, YouTube channel, Play Store
    reviews, and Calendar if the user left it public.
  why: >-
    *Why it's worth the setup:* a Gmail address is extraordinarily common as a person's primary identity,
    and this is the deepest free extraction of it. Maps reviews in particular are a goldmine — people
    review their own gym, their local coffee shop, their dentist, quietly mapping where they live.
  install:
  - os: All OS
    cmd: pipx install ghunt
  - os: Then
    cmd: ghunt login
    note: (paste cookies from a throwaway Google account, never your own)
  github: mxrch/GHunt
  caution:
    title: Use a burner Google account
    body: GHunt authenticates as a real Google session.
  verified:
    date: '2026-11-23'
    install_checked: partial
- id: holehe
  name: holehe
  section: 02-email
  kind: free · local tool · stale
  tier: deeper
  summary: 'Checks an email against 120-odd sites through their password-recovery flows. Stale: trust
    hits, not misses.'
  what: >-
    Checks an email address against 120-odd sites by abusing their password-recovery and registration
    flows — no email is ever sent to the target, it just reads what the form reveals. Tells you where
    an address is registered.
  why: >-
    *Why the caveat:* the technique is sound and it still finds things, but **the last release was 1.61
    in July 2022**. Four years of sites changing their reset flows means a lot of silent false negatives
    now. Run it, believe the hits, don't trust the misses — and cross-check against Epieos above. A newer
    tool in the same space, **user-scanner** (`pipx install user-scanner`), says it is actively maintained
    and is on PyPI, but it is young and its author promotes it, so verify its hits the same way.
  install:
  - os: All OS
    cmd: pipx install holehe
  - os: Run
    cmd: holehe <email>
  notes:
  - Accurate where it works, quietly out of date where it doesn't — PyPI still lists 1.61 as the latest
    release.
  github: megadose/holehe
  verified:
    date: '2026-11-23'
    install_checked: partial
- id: hunterio
  name: Hunter.io & email-format guessing
  section: 02-email
  kind: free tier · site
  tier: deeper
  summary: Given a domain, the organization's email pattern and the addresses already known.
  what: >-
    The reverse direction: given a *domain*, what do that organization's email addresses look like, and
    which ones are known? Hunter reports the pattern — `first.last@`, `flast@`, `first@` — and lists addresses
    it has seen, with a confidence score.
  why: >-
    *Why it matters:* once you know the pattern and have a staff list from section 06, you can construct
    an entire organization's email addresses from names alone. This is the exact pivot phishing operators
    use, which is why knowing it is defensive work too. Free tier is capped at a small number of searches
    a month.
  notes:
  - '[hunter.io](https://hunter.io/) — free tier needs an account; verify guesses before relying on them'
  links:
  - label: hunter.io
    url: https://hunter.io/
  verified:
    date: '2026-11-23'
- id: email-headers
  name: Reading the headers, not just the address
  section: 02-email
  kind: free · practice + sites
  tier: start
  summary: Read the full message headers to see where a message really came from and whether SPF, DKIM
    and DMARC passed.
  what: >-
    A different question from the rest of this section: not "where is this address registered" but "where
    did this *message* actually come from." The full headers record every server the mail passed through.
    Read `Received:` bottom-up — the earliest hop is closest to the sender — then check `Return-Path`
    against the display name, and whether **SPF, DKIM and DMARC** passed.
  why: >-
    *Why it's the fastest phishing verdict there is:* a message claiming to be from a bank whose first
    hop is a residential IP in an unrelated country, with SPF failing, is settled in thirty seconds. The
    originating IP then drops straight into §05. Get the raw headers from "Show original" (Gmail) or "View
    source" / message properties (Outlook) — the summary view hides exactly the fields you need.
  notes:
  - >-
    Paste into [mha.azurewebsites.net](https://mha.azurewebsites.net/) (Microsoft's Message Header Analyzer)
    or Google's [Messageheader](https://toolbox.googleapps.com/apps/messageheader/) — both parse the hops
    into a readable table
  links:
  - label: mha.azurewebsites.net
    url: https://mha.azurewebsites.net/
  - label: Messageheader
    url: https://toolbox.googleapps.com/apps/messageheader/
  caution:
    title: Headers below the first trusted hop are forgeable
    body: >-
      Anything a sender controls can be faked, so `Received` lines can be fabricated from the bottom up.
      Trust the hops added by *your own* mail infrastructure, and treat the rest as claims. SPF/DKIM/DMARC
      results are the part that can't be spoofed.
  verified:
    date: '2026-11-23'
- id: phoneinfoga
  name: PhoneInfoga
  section: 03-phone
  kind: free · local tool · Go
  tier: start
  summary: Country, carrier and line type for a number, then a sweep of public sources.
  what: >-
    Takes a number and establishes the basics — country, carrier, line type (mobile / landline / VoIP)
    — then runs it through search engines and reputation databases looking for where it's been posted
    publicly.
  why: >-
    *Why line type matters most:* "VoIP" is the single most useful field it returns. A VoIP number means
    a burner, a Google Voice line, or a service account, and that changes everything about how you read
    the rest of the investigation. A real carrier mobile means a real person with a real contract. **Status:**
    its README now calls it stable but unmaintained and warns the repository could be archived; the latest
    release is 2.11.0. Treat it as frozen — the line-type check still works, but the scanners that call
    out to other services will drift.
  install:
  - os: Docker
    cmd: docker run --rm -it sundowndev/phoneinfoga:latest scan -n "<number>"
  - os: Binary
    note: download the release for your OS from github.com/sundowndev/phoneinfoga/releases
  - os: Web UI
    cmd: phoneinfoga serve -p 5000
    note: (then open http://localhost:5000)
  notes:
  - >-
    Use the international format with the country code, e.g. `+14155550100`. The Docker line is the same
    on all three systems.
  links:
  - label: github.com/sundowndev/phoneinfoga
    url: https://github.com/sundowndev/phoneinfoga
  github: sundowndev/phoneinfoga
  verified:
    date: '2026-11-23'
    install_checked: partial
- id: messaging-presence
  name: Messaging-app presence check
  section: 03-phone
  kind: free · practice · burner device
  tier: deeper
  summary: Save the number on a burner device and see which messaging apps show a profile.
  what: >-
    Save the number as a contact on a burner device or secondary account and see which apps light up —
    WhatsApp, Signal, Telegram, Viber. Most will show you a profile photo, a display name, and sometimes
    a status line or last-seen, purely because you have the number.
  why: >-
    *Why it works:* contact discovery is a feature, not a bug, and almost nobody locks down the profile
    photo. A face and a real first name from a bare number is a large pivot. **Telegram in particular**
    often exposes a username, which drops you straight back into section 01.
  caution:
    title: This one is active, and it can notify
    body: >-
      Saving a contact is passive, but a mistaken tap sends a message or a request the target sees. Use
      a device and account that are not yours, and understand that some platforms have surfaced "so-and-so
      joined" notifications to the other party. Never do this from a personal phone.
  verified:
    date: '2026-11-23'
- id: search-operators
  name: Search operators, used properly
  section: 04-real-name
  kind: free · practice
  tier: start
  summary: 'Quoted phrases, site:, filetype: and friends, which outperform most dedicated tools for a
    name.'
  what: >-
    The unglamorous skill that outperforms most tools. `"exact phrase"` for names, `site:` to pin a platform,
    `filetype:pdf` for documents, `intitle:` and `inurl:` for structure, `-term` to cut noise. Combine
    them: `"Jane Smith" site:linkedin.com`, or `"Jane Smith" filetype:pdf` to find her in a conference
    programme or a board minutes PDF.
  why: >-
    *Why it leads this section:* a specialized tool searches a fixed list of sites. An operator query
    searches the indexed web. For a name, the second one wins more often than people expect — and **run
    the same query on Bing and DuckDuckGo too**, since their indexes and their tolerance for operator
    queries differ from Google's.
  notes:
  - >-
    The Google Hacking Database at [exploit-db.com/google-hacking-database](https://www.exploit-db.com/google-hacking-database)
    catalogs the heavy-duty patterns
  links:
