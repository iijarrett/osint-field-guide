- id: change-detection
  name: Reading imagery — date, resolution, shadows, clouds
  section: 12-tracking
  kind: free · practice
  tier: deeper
  summary: 'Four questions to ask of any overhead image: date, resolution, shadows, what changed.'
  what: >-
    Four questions for any overhead image before you claim anything from it: **what date** is this scene
    really, **what resolution** is it, **where do the shadows fall**, and **what is cloud or haze hiding**.
    Compare two dates of the same place rather than interpreting one frame, and confirm with a ground-level
    photo whenever one exists.
  why: >-
    *Why it's a step:* most wrong conclusions in this field come from reading a blurry pixel as a thing.
    Shadow direction and length also date a scene — the sun tools in §07 (SunCalc, ShadeMap) work on satellite
    shadows exactly as they do on photo shadows, and the two together locate and date an image.
  notes:
  - >-
    Pair with §07 geolocation (Overpass Turbo, Mapillary, SunCalc) and §14 capture — save each scene with
    its date and the viewer's own date label
  verified:
    date: '2026-11-23'
- id: c2pa
  name: Check provenance first — Content Credentials (C2PA)
  section: 13-synthetic-media
  kind: free · site + CLI
  tier: start
  summary: Verify a file's signed Content Credentials; a missing manifest means unknown, not clean.
  what: >-
    C2PA is a signed record, attached to a file by the camera, editor or AI tool that made it, of where
    it came from and what was done to it. Drop a file into a Content Credentials verifier and it reads
    and checks that record. **c2patool** is the open-source command-line version.
  why: >-
    *Why first:* when a manifest exists and verifies, it answers the question directly. **When it doesn't
    exist it tells you nothing** — most files carry no credentials, and credentials can be stripped, so
    a missing manifest means *unknown*, never *clean*.
  install:
  - os: All OS
    cmd: cargo install c2patool
    note: (needs Rust; or take a release binary from github.com/contentauth/c2pa-rs)
  - os: Run
    cmd: c2patool <file>
  notes:
  - '[verify.contentauthenticity.org](https://verify.contentauthenticity.org/) — free, browser-based'
  links:
  - label: verify.contentauthenticity.org
    url: https://verify.contentauthenticity.org/
  - label: github.com/contentauth/c2pa-rs
    url: https://github.com/contentauth/c2pa-rs
  github: contentauth/c2pa-rs
  verified:
    date: '2026-11-23'
    install_checked: partial
- id: watermark-check
  name: Vendor watermark checkers — SynthID, OpenAI, Meta
  section: 13-synthetic-media
  kind: free · sites
  tier: start
  summary: 'Vendor checkers for SynthID and similar marks: strong when positive, nearly useless when negative.'
  what: >-
    The big AI vendors mark what their own tools produce and publish a way to check. Google's **SynthID
    Detector** reads Google's invisible watermark; OpenAI and Meta each offer a check for their own output.
    Each recognizes only its own vendor's content.
  why: >-
    *Why they're a narrow tool:* a positive is strong evidence, a negative is nearly worthless. Reporting
    has already shown these checks failing on a photographed screen and on cropped images, and watermark-stripping
    tools exist. Use them to confirm a suspicion, never to clear a file.
  notes:
  - >-
    Google SynthID Detector (synthid.com, or ask Gemini) · OpenAI and Meta verification pages — find the
    current links from each vendor's own site, as the URLs have moved
  verified:
    date: '2026-11-23'
- id: ai-detectors
  name: AI-image detectors — Hive, AI or Not & friends
  section: 13-synthetic-media
  kind: free tier · sites
  tier: deeper
  summary: 'AI-image classifiers (Hive, AI or Not): one weak signal, never a finding.'
  what: >-
    Upload an image, get a probability that it's AI-generated. **Hive** is free and among the better-regarded
    public ones; **AI or Not**, Illuminarty and Sightengine have free tiers or paid APIs.
  why: >-
    *Why "one signal":* the accuracy figures vendors quote are their own, and practitioners' consistent
    finding is that there's still no reliable public detector for the best current AI video. Treat a score
    as a prompt for human review, and require two or more *independent* indicators before you call something
    synthetic.
  notes:
  - >-
    [hivemoderation.com](https://hivemoderation.com/ai-generated-content-detection) · [aiornot.com](https://www.aiornot.com/)
    — upload only what you have the right to upload (see the VirusTotal note in §05: uploading is disclosure)
  links:
  - label: hivemoderation.com
    url: https://hivemoderation.com/ai-generated-content-detection
  - label: aiornot.com
    url: https://www.aiornot.com/
  caution:
    title: A detector score is not a finding
    body: >-
      Never publish "this is AI" on a detector's say-so alone. Record the tool, the date and the score
      as an observation; the conclusion needs corroboration.
  verified:
    date: '2026-11-23'
- id: image-forensics
  name: Image forensics — FotoForensics, Forensically & ExifTool
  section: 13-synthetic-media
  kind: free · site + local
  tier: deeper
  summary: Error-level analysis, clone detection and metadata checks for manipulated images.
  what: >-
    Classic manipulation checks that work on any image: **error-level analysis** (FotoForensics, Forensically)
    highlights regions that were compressed differently from the rest, Forensically also offers clone
    detection and noise analysis, and **ExifTool** (§07) shows the editing software and timestamps.
  why: >-
    *Why they still matter:* they test the file rather than guess at the content, so they catch the ordinary
    Photoshop edit and the recycled screenshot that an AI detector will pass. They are weaker against
    fully generated images, and error-level analysis can mislead on heavily recompressed files — read
    it as a hint.
  notes:
  - >-
    [fotoforensics.com](https://fotoforensics.com/) · [29a.ch/photo-forensics](https://29a.ch/photo-forensics/)
    — Forensically runs in the browser · ExifTool lines are in §07
  links:
  - label: fotoforensics.com
    url: https://fotoforensics.com/
  - label: 29a.ch/photo-forensics
    url: https://29a.ch/photo-forensics/
  verified:
    date: '2026-11-23'
- id: deepfake-audio-face
  name: Face-swap and voice-clone checks
  section: 13-synthetic-media
  kind: free · sites
  tier: deeper
  summary: DeepFake-O-Meter and voice-clone detectors; keyframe search and callbacks often beat both.
  what: >-
    **DeepFake-O-Meter** (a university-run service) runs a clip through several open detectors at once
    and shows where they disagree. **Hiya's Deepfake Voice Detector** is a browser extension for suspect
    audio. For video, **InVID** (§07) breaks a clip into keyframes you can reverse-search.
  why: >-
    *Why they sit next to the image tools:* the strongest evidence is usually not the model's verdict
    but a keyframe that reverse-searches to older footage, or a voice that fails a callback to a known
    number. Detectors disagree, and that disagreement is itself worth recording.
  notes:
  - >-
    [DeepFake-O-Meter](https://zinc.cse.buffalo.edu/ubmdfl/deep-o-meter/) · Hiya Deepfake Voice Detector
    — Chrome extension store
  links:
  - label: DeepFake-O-Meter
    url: https://zinc.cse.buffalo.edu/ubmdfl/deep-o-meter/
  verified:
    date: '2026-11-23'
- id: two-indicators
  name: The two-indicator rule — context beats classifiers
  section: 13-synthetic-media
  kind: free · practice
  tier: start
  summary: Call a file synthetic or authentic only on two independent indicators.
  what: >-
    Don't call a file synthetic or authentic on one signal. Collect indicators from different domains
    — provenance, forensics, visual and physical consistency (hands, text, shadows, reflections), and
    **context**: the earliest upload, the posting account, whether anyone credible was there. Two independent
    indicators agreeing is a finding; one is a lead. Keep the original file and its hash.
  why: >-
    *Why context wins:* the tools above lose ground every time a new generator ships, while "where did
    this first appear, and who benefits" does not age. Run the reverse-image and earliest-version steps
    from §07 and the account checks from §08 before you reach for a classifier.
  notes:
  - >-
    Observed (tool, date, score) → inferred (what you conclude) → confidence — keep the three in separate
    columns of the §14 timeline
  verified:
    date: '2026-11-23'
- id: capture
  name: Capture discipline — the habit, then the tool
  section: 14-tradecraft-and-analysis
  kind: free · practice
  tier: start
  summary: Record URL, UTC time, screenshot and archive link the moment you find something.
  what: >-
    Every finding gets four things recorded at the moment you find it: the **full URL**, the **UTC timestamp**,
    a **screenshot showing the URL bar**, and an **archive link**. Keep a running log — a plain markdown
    file or an Obsidian vault is entirely sufficient — with one entry per finding and an explicit note
    of which selector it came from.
  why: >-
    *Why it's item one here:* an investigation you can't reconstruct is worthless, and pages disappear
    precisely when they matter. This also forces the discipline of separating *what you observed* from
    *what you concluded* — the distinction that keeps an OSINT report honest.
  verified:
    date: '2026-11-23'
- id: archivebox
  name: ArchiveBox
  section: 14-tradecraft-and-analysis
  kind: free · local tool · Python / Docker
  tier: deeper
  summary: Self-hosted web archiver that keeps your own copies of pages you cite.
  what: >-
    A self-hosted web archiver. Feed it URLs and it saves each page several ways — HTML, a PDF, a screenshot,
    a WARC, the media — into a folder you own, with a web UI to browse them.
  why: >-
    *Why it beats "screenshot it":* you get a copy that's searchable, hashed and independent of whether
    the Wayback Machine happened to capture the page. It's the free, scriptable stand-in for Hunchly's
    capture, and it can ingest a whole list of URLs from your case log in one command. Upstream describes
    Docker Compose as its recommended install.
  install:
  - os: Docker
    cmd: docker run -v $PWD/archive:/data -p 8000:8000 -it archivebox/archivebox init --setup
    note: (then run it the same way with 'server')
  - os: Linux/Mac
    cmd: pipx install archivebox ; archivebox init ; archivebox add 'https://example.com'
  - os: Windows
    note: use the Docker line, or run the Linux line inside WSL — upstream lists no native Windows install
  notes:
  - >-
    Upstream's page was read on 23 Nov 2026 and describes active development; the Homebrew formula the
    guide expected does not exist, so it isn't listed. The Docker image tag and flags follow the project's
    documented pattern — confirm against its README before relying on them.
  links:
  - label: example.com
    url: https://example.com
  verified:
    date: '2026-11-23'
    install_checked: partial
- id: singlefile
  name: SingleFile
  section: 14-tradecraft-and-analysis
  kind: free · browser extension + CLI
  tier: start
  summary: Browser extension that saves a page as one self-contained HTML file.
  what: >-
    A browser extension that saves the page you're looking at into one self-contained HTML file — styles,
