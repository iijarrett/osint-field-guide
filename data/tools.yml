- id: dns-browser
  name: DNSDumpster, Robtex & DNSViz
  section: 05-domain-ip-network
  kind: free · sites
  tier: start
  summary: 'No-install DNS views: host maps, reverse nameserver and IP pivots, DNSSEC chains.'
  what: >-
    The no-install layer under §05's command-line tools. **DNSDumpster** maps a domain's hosts, MX, TXT
    and netblocks and draws the relationships. **Robtex** pivots the other way — given an IP or nameserver,
    what *else* points at it. **DNSViz** visualizes the DNSSEC chain and shows exactly where validation
    breaks.
  why: >-
    *Why keep browser tools when you have subfinder:* they're instant, they need no setup, and Robtex's
    reverse pivot in particular — every domain sharing a nameserver or an IP — is a shared-hosting and
    shared-operator signal the enumeration tools don't hand you directly. Use these first, then reach
    for the CLI when you need depth or automation.
  notes:
  - >-
    [dnsdumpster.com](https://dnsdumpster.com/) · [robtex.com](https://www.robtex.com/) · [dnsviz.net](https://dnsviz.net/)
  links:
  - label: dnsdumpster.com
