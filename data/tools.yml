  - label: globalfishingwatch.org
    url: https://globalfishingwatch.org/
  verified:
    date: '2026-11-23'
- id: sat-free
  name: Free satellite imagery — Copernicus, NASA Worldview & FIRMS, Google Earth Pro
  section: 12-tracking
  kind: free · sites + desktop app
  tier: start
  summary: Free satellite imagery from Copernicus, NASA and similar sources.
  what: >-
    The free layer of looking at a place from above. The **Copernicus Browser** serves Sentinel imagery
    (about 10 m per pixel, revisited every few days) with a time slider. **NASA Worldview** is daily,
    coarse and global, and **NASA FIRMS** maps detected thermal anomalies, i.e. fires. **Google Earth
    Pro** (free desktop) holds years of historical high-resolution imagery you can scrub through.
  why: >-
    *Why they're complementary:* Sentinel and Worldview tell you *when something changed* at the scale
    of a field, a burn scar or a flooded plain; Earth Pro tells you what it looked like in detail on some
    earlier date. None of the free sources will show a vehicle, and cloud cover is the usual reason a
    date you wanted is useless.
  install:
  - os: Sites
    note: browser.dataspace.copernicus.eu · worldview.earthdata.nasa.gov · firms.modaps.eosdis.nasa.gov
  - os: Windows
    cmd: winget install Google.EarthPro
  - os: macOS
    cmd: brew install --cask google-earth-pro
  - os: Linux
    note: download the .deb from google.com/earth/versions
  notes:
  - Earth Pro's winget ID was not machine-checked; the Homebrew cask was. The imagery sites need no install.
  verified:
    date: '2026-11-23'
    install_checked: partial
- id: sat-commercial
  name: High-resolution and radar imagery
  section: 12-tracking
  kind: paid · sites
  tier: gated
  summary: 'High-resolution and radar imagery you can order: Planet, SkyFi, Umbra.'
  what: >-
    **Planet** (frequent, mid-resolution), **SkyFi** (order a specific tasking or archive scene by credit
    card) and **Umbra** (synthetic-aperture radar, which sees through cloud and at night) sell what the
    free tier can't: detail, frequency and all-weather coverage.
  why: >-
    *Why know them:* they're what published investigations of military build-ups and port activity are
    built on, and a small purchase is sometimes cheaper than the hours of free-imagery guesswork. Pricing
    and access terms change often — check each site rather than trusting a list.
  notes:
  - >-
    [planet.com](https://www.planet.com/) · [skyfi.com](https://www.skyfi.com/) · [umbra.space](https://umbra.space/)
  links:
